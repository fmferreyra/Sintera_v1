services:

  db:
    image: postgres:14
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - sintera_internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  app:
    image: redmine:7.0.0
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      REDMINE_DB_POSTGRES: ${REDMINE_DB_HOST}
      REDMINE_DB_PORT: ${REDMINE_DB_PORT}
      REDMINE_DB_DATABASE: ${REDMINE_DB_DATABASE}
      REDMINE_DB_USERNAME: ${REDMINE_DB_USERNAME}
      REDMINE_DB_PASSWORD: ${REDMINE_DB_PASSWORD}

      SECRET_KEY_BASE: ${SECRET_KEY_BASE}

      REDMINE_PLUGINS_MIGRATE: "true"

      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      SMTP_USER_NAME: ${SMTP_USER_NAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-login}
      SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
      REDMINE_EMAIL_FROM: ${REDMINE_EMAIL_FROM:-}

    volumes:
      - redmine_files:/usr/src/redmine/files
      - ./redmine/plugins:/usr/src/redmine/plugins
      - ./redmine/themes:/usr/src/redmine/themes
      - ./redmine/config/configuration.yml:/usr/src/redmine/config/configuration.yml
      - ./redmine/config/locales/es.yml:/usr/src/redmine/config/locales/es.yml

    networks:
      - sintera_internal


  proxy:
    image: caddy:2
    restart: unless-stopped

    depends_on:
      - app

    entrypoint: ["/bin/sh", "/entrypoint.sh"]

    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}

    ports:
      - "${HTTP_PORT:-3000}:80"
      - "${HTTPS_PORT:-3443}:443"

    volumes:
      - ./proxy/entrypoint.sh:/entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - sintera_internal


networks:

  sintera_internal:
    driver: bridge


volumes:

  postgres_data:
    name: sintera_postgres_data

  redmine_files:
    name: sintera_redmine_files

  caddy_data:
    name: sintera_caddy_data

  caddy_config:
    name: sintera_caddy_config